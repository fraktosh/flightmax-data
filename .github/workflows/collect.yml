name: Collect and train

on:
  schedule:
    # GitHub drops or delays many scheduled runs, so this is only a backstop.
    # Each successful run queues the next one itself (see "Queue next run").
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to collect for
        default: "50"

permissions:
  contents: write
  actions: write # lets a run dispatch the next one

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out data
        uses: actions/checkout@v4
        with:
          path: data

      # Collector and training code live in the private fraktosh/flightmax repo;
      # it's pulled at run time with a read-only deploy key and never committed here.
      - name: Check out collector code
        uses: actions/checkout@v4
        with:
          repository: fraktosh/flightmax
          ssh-key: ${{ secrets.FLIGHTMAX_DEPLOY_KEY }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: app

      - name: Collect
        working-directory: app
        env:
          COLLECTOR_MINUTES: ${{ inputs.minutes || vars.COLLECTOR_MINUTES || '50' }}
        run: npx tsx collector/run.ts --store ../data

      - name: Train
        if: always()
        working-directory: app
        env:
          # Predictions are encrypted with this before they reach the public repo.
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: npx tsx collector/train.ts --store ../data

      - name: Status page and dashboard
        if: always()
        working-directory: app
        run: |
          npx tsx collector/status.ts --store ../data
          cp collector/site/index.html ../data/index.html

      - name: Commit
        if: always()
        working-directory: data
        run: |
          git config user.name "fare-collector"
          git config user.email "fare-collector@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "data: $(tail -n 1 runs.ndjson | cut -c1-120)"
          git pull --quiet --rebase -X theirs
          git push

      # Chain runs so collection and the status page don't depend on cron.
      # Set repo variable CHAIN_RUNS=false to stop the chain.
      - name: Queue next run
        if: success() && vars.CHAIN_RUNS != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml -R ${{ github.repository }} --ref ${{ github.ref_name }}
