name: Watchdog

# The Oracle VM (see vps/) collects every ~28 min and pushes runs.ndjson.
# If the newest run in runs.ndjson is older than STALE_MINUTES and no
# fallback run is active, start "Collect and train" on GitHub Actions.
# Safe to trigger as often as you like.
#
# GitHub drops many scheduled runs, so an external scheduler (cron-job.org)
# can also call this workflow's dispatch API.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: true

env:
  STALE_MINUTES: 75

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start fallback collect if the VM is stale
        if: vars.FALLBACK_RUNS != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          last=$(gh api "repos/$REPO/contents/runs.ndjson" -H "Accept: application/vnd.github.raw" | tail -n 1 | jq -r .startedAt)
          age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
          echo "Newest run started $last ($age min ago)."
          if [ "$age" -lt "$STALE_MINUTES" ]; then
            echo "Collector is healthy; nothing to do."
            exit 0
          fi
          active=0
          for status in queued in_progress waiting pending requested; do
            n=$(gh run list -R "$REPO" -w collect.yml -s "$status" -L 5 --json databaseId -q length)
            active=$((active + n))
          done
          if [ "$active" -gt 0 ]; then
            echo "Fallback collect already active; nothing to do."
          else
            echo "Collector is stale; starting fallback collect."
            gh workflow run collect.yml -R "$REPO" --ref main
          fi
